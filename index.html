<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Delivery App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <nav class="mb-4">
        <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Home</a>
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('main.view_cart') }}" class="btn btn-outline-primary">Cart</a>
            <a href="{{ url_for('main.view_orders') }}" class="btn btn-outline-success">My Orders</a>
            <a href="{{ url_for('main.logout') }}" class="btn btn-danger">Logout</a>
        {% else %}
            <a href="{{ url_for('main.login') }}" class="btn btn-primary">Login</a>
            <a href="{{ url_for('main.register') }}" class="btn btn-success">Register</a>
        {% endif %}
    </nav>

    <h1>Available Restaurants</h1>
    <ul class="list-group">
        {% for r in restaurants %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <h5>{{ r.name }}</h5>
                    <p class="text-muted mb-0">Cuisine: {{ r.cuisine }}</p>
                </div>
                <a href="{{ url_for('main.restaurant_detail', restaurant_id=r.id) }}" class="btn btn-sm btn-primary">View Menu</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
